<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="terminal-title terminal-description">
<title id="terminal-title">I’m Zeyad Al-Ajami.</title>
<desc id="terminal-description">A friendly green terminal window. zeyad@cairo: ~. $ hello --world. I’m Zeyad Al-Ajami. interface → API → database. $ make something useful.</desc>
